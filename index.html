<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Round-Up 1 - To'liq 19 ta Mavzu Testi</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.4rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #4b5563;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .unit-badge {
            background-color: #e0e7ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        .option-btn.correct {
            background-color: #d1fae5;
            border-color: var(--success);
            color: #065f46;
        }

        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .result-container h2 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--success);
            margin: 20px 0;
        }

        .restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>New Round-Up 1</h1>
        <div class="subtitle">Barcha 19 ta mavzudan tuzilgan to'liq test</div>

        <div id="quiz-screen">
            <div class="quiz-header">
                <span id="question-count">Savol: 1 / 100</span>
                <span id="unit-title" class="unit-badge">Unit 1</span>
            </div>
            <div id="question-text" class="question-text">Savol yuklanmoqda...</div>
            <div id="options-list" class="options-list"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">Keyingi savol</button>
        </div>

        <div id="result-screen" class="result-container">
            <h2>Test yakunlandi! 🎉</h2>
            <p>Sizning natijangiz:</p>
            <div id="score-text" class="score-display">0 / 100</div>
            <p id="result-message" style="margin-bottom: 20px; color: #4b5563;"></p>
            <button class="restart-btn" onclick="restartQuiz()">Qaytadan boshlash</button>
        </div>
    </div>

    <script>
        const questions = [
            // Unit 1: Personal Pronouns / Verb "To Be"
            { unit: "Unit 1", q: "Choose the correct pronoun: '___ is a doctor.' (talking about a man)", options: ["She", "He", "It", "They"], answer: 1 },
            { unit: "Unit 1", q: "Complete the sentence: 'We ___ students.'", options: ["am", "is", "are", "be"], answer: 2 },
            { unit: "Unit 1", q: "Choose the correct form: 'I ___ twelve years old.'", options: ["am", "is", "are", "be"], answer: 0 },
            { unit: "Unit 1", q: "What is the short form of 'They are'?", options: ["Theirs", "They're", "Their", "Theym"], answer: 1 },
            { unit: "Unit 1", q: "Choose the correct option: '___ is a cat.'", options: ["He", "She", "It", "They"], answer: 2 },

            // Unit 2: Plurals (-s / -es)
            { unit: "Unit 2", q: "What is the plural form of 'book'?", options: ["bookes", "books", "booki", "bookz"], answer: 1 },
            { unit: "Unit 2", q: "Choose the correct plural form of 'bus':", options: ["buses", "buss", "bux", "busies"], answer: 0 },
            { unit: "Unit 2", q: "What is the plural of 'baby'?", options: ["babys", "babies", "baby", "babiez"], answer: 1 },
            { unit: "Unit 2", q: "Choose the correct plural form of 'box':", options: ["boxs", "boxes", "boxies", "boxen"], answer: 1 },
            { unit: "Unit 2", q: "What is the plural form of 'child'?", options: ["childs", "children", "childes", "child"], answer: 1 },

            // Unit 3: Articles (A / An)
            { unit: "Unit 3", q: "Choose the correct article: '___ apple a day keeps the doctor away.'", options: ["A", "An", "The", "-"], answer: 1 },
            { unit: "Unit 3", q: "Choose the correct article: 'He has got ___ dog.'", options: ["an", "a", "the", "-"], answer: 1 },
            { unit: "Unit 3", q: "Choose the correct article: 'She is ___ honest girl.'", options: ["a", "an", "the", "-"], answer: 1 },
            { unit: "Unit 3", q: "Choose the correct option: 'I saw ___ elephant at the zoo.'", options: ["a", "an", "the", "some"], answer: 1 },
            { unit: "Unit 3", q: "Choose the correct article: 'This is ___ umbrella.'", options: ["a", "an", "the", "some"], answer: 1 },

            // Unit 4: This / That / These / Those
            { unit: "Unit 4", q: "Look at the book near me. I say: '___ is my book.'", options: ["This", "That", "These", "Those"], answer: 0 },
            { unit: "Unit 4", q: "Look at the stars far away. '___ are bright stars.'", options: ["This", "That", "These", "Those"], answer: 3 },
            { unit: "Unit 4", q: "Choose the correct option for a single item far away: '___ is a bird.'", options: ["This", "That", "These", "Those"], answer: 1 },
            { unit: "Unit 4", q: "Plural form of 'This' is:", options: ["That", "These", "Those", "Them"], answer: 1 },
            { unit: "Unit 4", q: "Choose the correct option for plural items near me: '___ are my pencils.'", options: ["This", "That", "These", "Those"], answer: 2 },

            // Unit 5: Have got / Has got
            { unit: "Unit 5", q: "Choose the correct form: 'She ___ got a new car.'", options: ["have", "has", "is", "are"], answer: 1 },
            { unit: "Unit 5", q: "Complete the sentence: 'I ___ got two brothers.'", options: ["has", "have", "am", "do"], answer: 1 },
            { unit: "Unit 5", q: "Make it interrogative: '___ you got a pen?'", options: ["Do", "Are", "Have", "Has"], answer: 2 },
            { unit: "Unit 5", q: "Choose the correct negative form: 'He ___ got a computer.'", options: ["haven't", "hasn't", "isn't", "don't"], answer: 1 },
            { unit: "Unit 5", q: "Complete: 'They ___ got a big house.'", options: ["has", "have", "are", "is"], answer: 1 },

            // Unit 6: Can / Can't (Ability)
            { unit: "Unit 6", q: "Choose the correct modal verb for ability: 'A fish ___ swim.'", options: ["can", "can't", "is", "has"], answer: 0 },
            { unit: "Unit 6", q: "Complete: 'Birds can fly, but humans ___ fly.'", options: ["can", "can't", "are", "do"], answer: 1 },
            { unit: "Unit 6", q: "Choose the correct question: '___ you speak English?'", options: ["Are", "Do", "Can", "Have"], answer: 2 },
            { unit: "Unit 6", q: "Complete: 'He is only 1 year old, so he ___ walk yet.'", options: ["can", "can't", "is", "has"], answer: 1 },
            { unit: "Unit 6", q: "Choose the correct short answer: 'Can she swim? - Yes, she ___.'", options: ["can", "can't", "is", "does"], answer: 0 },

            // Unit 7: Imperatives / Let's
            { unit: "Unit 7", q: "Choose the correct imperative: '___ the door, please.'", options: ["Opening", "Close", "Closed", "Closes"], answer: 1 },
            { unit: "Unit 7", q: "Negative imperative: '___ run in the classroom!'", options: ["Don't", "No", "Aren't", "Can't"], answer: 0 },
            { unit: "Unit 7", q: "Complete with 'Let's': '___ go to the park!'", options: ["Let", "Let's", "Lets", "To"], answer: 1 },
            { unit: "Unit 7", q: "Choose the correct command: '___ quiet, please.'", options: ["Be", "Is", "Are", "Am"], answer: 0 },
            { unit: "Unit 7", q: "Choose the negative command: '___ touch the hot stove!'", options: ["Not", "Don't", "No", "Aren't"], answer: 1 },

            // Unit 8: Present Continuous
            { unit: "Unit 8", q: "Choose the correct form: 'Look! She ___ football now.'", options: ["play", "plays", "is playing", "playing"], answer: 2 },
            { unit: "Unit 8", q: "Complete: 'What ___ you doing at the moment?'", options: ["is", "are", "do", "does"], answer: 1 },
            { unit: "Unit 8", q: "Negative form: 'They ___ listening to music right now.'", options: ["isn't", "aren't", "don't", "haven't"], answer: 1 },
            { unit: "Unit 8", q: "Choose the correct spelling with -ing: 'swim'", options: ["swiming", "swimming", "swimng", "swimm"], answer: 1 },
            { unit: "Unit 8", q: "Complete: 'Listen! The baby ___ crying.'", options: ["is", "are", "am", "be"], answer: 0 },

            // Unit 9: Present Simple
            { unit: "Unit 9", q: "Choose the correct form: 'I ___ up early every morning.'", options: ["get", "gets", "getting", "got"], answer: 0 },
            { unit: "Unit 9", q: "Complete: 'He ___ to school by bus.'", options: ["go", "goes", "going", "gone"], answer: 1 },
            { unit: "Unit 9", q: "Choose the correct negative: 'She ___ like milk.'", options: ["don't", "doesn't", "isn't", "aren't"], answer: 1 },
            { unit: "Unit 9", q: "Complete the question: '___ you speak English?'", options: ["Does", "Are", "Do", "Is"], answer: 2 },
            { unit: "Unit 9", q: "Choose the correct form: 'They ___ football on Sundays.'", options: ["plays", "play", "playing", "played"], answer: 1 },

            // Unit 10: Prepositions of Time (in / on / at)
            { unit: "Unit 10", q: "Choose the correct preposition: 'My birthday is ___ July.'", options: ["in", "on", "at", "by"], answer: 0 },
            { unit: "Unit 10", q: "Complete: 'The party is ___ Friday.'", options: ["in", "on", "at", "to"], answer: 1 },
            { unit: "Unit 10", q: "Choose the correct preposition: 'I wake up ___ 7 o'clock.'", options: ["in", "on", "at", "under"], answer: 2 },
            { unit: "Unit 10", q: "Complete: 'We sleep ___ night.'", options: ["in", "on", "at", "by"], answer: 2 },
            { unit: "Unit 10", q: "Choose the correct option: 'It is cold ___ winter.'", options: ["in", "on", "at", "to"], answer: 0 },

            // Unit 11: Prepositions of Place (in / on / at / under / behind...)
            { unit: "Unit 11", q: "Choose the correct preposition: 'The cat is ___ the table (tag ostida).'", options: ["in", "on", "under", "at"], answer: 2 },
            { unit: "Unit 11", q: "Complete: 'The books are ___ the bag (sumka ichida).'", options: ["in", "on", "at", "under"], answer: 0 },
            { unit: "Unit 11", q: "Choose the correct option: 'The picture is ___ the wall (devorda).'", options: ["in", "on", "at", "under"], answer: 1 },
            { unit: "Unit 11", q: "Complete: 'He is waiting ___ the bus stop.'", options: ["in", "on", "at", "under"], answer: 2 },
            { unit: "Unit 11", q: "Choose the correct option: 'The dog is sitting ___ me and you (orasida).'", options: ["between", "in", "on", "at"], answer: 0 },

            // Unit 12: Adjectives / Comparisons
            { unit: "Unit 12", q: "Choose the comparative form: 'An elephant is ___ than a dog.'", options: ["big", "bigger", "biggest", "more big"], answer: 1 },
            { unit: "Unit 12", q: "Complete: 'Mount Everest is the ___ mountain.'", options: ["high", "higher", "highest", "more high"], answer: 2 },
            { unit: "Unit 12", q: "Choose the correct comparative: 'A car is ___ than a bicycle.'", options: ["fast", "faster", "fastest", "more fast"], answer: 1 },
            { unit: "Unit 12", q: "What is the superlative form of 'good'?", options: ["gooder", "best", "goodest", "better"], answer: 1 },
            { unit: "Unit 12", q: "Choose the correct form: 'This test is ___ than that one.'", options: ["easy", "easier", "easiest", "more easy"], answer: 1 },

            // Unit 13: Past Simple (To Be: was / were)
            { unit: "Unit 13", q: "Choose the correct past form: 'I ___ at home yesterday.'", options: ["was", "were", "is", "are"], answer: 0 },
            { unit: "Unit 13", q: "Complete: 'They ___ happy with the results.'", options: ["was", "were", "is", "are"], answer: 1 },
            { unit: "Unit 13", q: "Choose the negative past form: 'He ___ at school last Monday.'", options: ["wasn't", "weren't", "isn't", "don't"], answer: 0 },
            { unit: "Unit 13", q: "Complete the question: '___ you tired last night?'", options: ["Was", "Were", "Did", "Are"], answer: 1 },
            { unit: "Unit 13", q: "Choose the correct form: 'She ___ born in 2012.'", options: ["was", "were", "is", "did"], answer: 0 },

            // Unit 14: Past Simple (Regular verbs)
            { unit: "Unit 14", q: "Choose the past simple form of 'play':", options: ["playd", "played", "playing", "plays"], answer: 1 },
            { unit: "Unit 14", q: "Complete: 'She ___ TV last night.'", options: ["watch", "watched", "watching", "watches"], answer: 1 },
            { unit: "Unit 14", q: "Choose the correct negative: 'I ___ visit my grandma yesterday.'", options: ["didn't", "haven't", "wasn't", "don't"], answer: 0 },
            { unit: "Unit 14", q: "Complete the question: '___ you clean your room yesterday?'", options: ["Do", "Did", "Were", "Have"], answer: 1 },
            { unit: "Unit 14", q: "What is the past form of 'listen'?", options: ["listend", "listened", "listening", "listen"], answer: 1 },

            // Unit 15: Past Simple (Irregular verbs)
            { unit: "Unit 15", q: "What is the past simple form of 'go'?", options: ["goed", "went", "gone", "going"], answer: 1 },
            { unit: "Unit 15", q: "Choose the past form of 'see':", options: ["seed", "saw", "seen", "seeing"], answer: 1 },
            { unit: "Unit 15", q: "Complete: 'He ___ an apple for lunch yesterday.'", options: ["eat", "ate", "eaten", "eating"], answer: 1 },
            { unit: "Unit 15", q: "What is the past form of 'have'?", options: ["haived", "had", "has", "haven"], answer: 1 },
            { unit: "Unit 15", q: "Choose the past form of 'buy':", options: ["buyed", "bought", "brought", "buying"], answer: 1 },

            // Unit 16: Future Simple (Will / Be going to)
            { unit: "Unit 16", q: "Choose the correct future form: 'I think it ___ rain tomorrow.'", options: ["will", "is", "going to", "was"], answer: 0 },
            { unit: "Unit 16", q: "Complete with 'be going to': 'She ___ visit her aunt next week.'", options: ["is going to", "will", "goes", "went"], answer: 0 },
            { unit: "Unit 16", q: "Choose the correct negative: 'We ___ not go to the party tomorrow.'", options: ["will", "are", "do", "did"], answer: 0 },
            { unit: "Unit 16", q: "Complete the question: '___ you help me with my homework?'", options: ["Are", "Will", "Do", "Did"], answer: 1 },
            { unit: "Unit 16", q: "Choose the correct option: 'Look at those clouds! It ___ rain.'", options: ["will", "is going to", "is", "rains"], answer: 1 },

            // Unit 17: Countable & Uncountable Nouns / Some / Any
            { unit: "Unit 17", q: "Choose the correct option: 'I have ___ apples in the basket.'", options: ["some", "any", "a", "an"], answer: 0 },
            { unit: "Unit 17", q: "Complete the negative sentence: 'We don't have ___ milk left.'", options: ["some", "any", "a", "an"], answer: 1 },
            { unit: "Unit 17", q: "Choose the correct word for uncountable nouns: 'Can I have ___ water?'", options: ["some", "any", "a", "many"], answer: 0 },
            { unit: "Unit 17", q: "Complete the question: 'Are there ___ students in the room?'", options: ["some", "any", "a", "much"], answer: 1 },
            { unit: "Unit 17", q: "Which of these is uncountable?", options: ["apple", "water", "chair", "book"], answer: 1 },

            // Unit 18: Must / Mustn't / Have to
            { unit: "Unit 18", q: "Choose the correct obligation: 'You ___ obey the school rules.'", options: ["must", "mustn't", "can", "don't"], answer: 0 },
            { unit: "Unit 18", q: "Complete the prohibition: 'You ___ park here. It is forbidden.'", options: ["must", "mustn't", "can", "have to"], answer: 1 },
            { unit: "Unit 18", q: "Choose the correct option: 'It's raining. I ___ take an umbrella.'", options: ["must", "mustn't", "can't", "aren't"], answer: 0 },
            { unit: "Unit 18", q: "Complete: 'You ___ talk during the exam.'", options: ["must", "mustn't", "can", "will"], answer: 1 },
            { unit: "Unit 18", q: "Choose the correct form: 'Students ___ wear uniform at our school.'", options: ["must", "mustn't", "can't", "no"], answer: 0 },

            // Unit 19: Conjunctions (And / But / Because / So)
            { unit: "Unit 19", q: "Choose the correct conjunction: 'I like apples ___ bananas.'", options: ["and", "but", "because", "so"], answer: 0 },
            { unit: "Unit 19", q: "Complete: 'I wanted to go out, ___ it was raining.'", options: ["and", "but", "because", "so"], answer: 1 },
            { unit: "Unit 19", q: "Choose the correct option: 'She was tired, ___ she went to bed early.'", options: ["because", "so", "but", "and"], answer: 1 },
            { unit: "Unit 19", q: "Complete: 'He stayed at home ___ he was sick.'", options: ["because", "so", "but", "and"], answer: 0 },
            { unit: "Unit 19", q: "Choose the correct conjunction: 'I can speak English ___ I can't speak French.'", options: ["and", "but", "because", "so"], answer: 1 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionCountEl = document.getElementById("question-count");
        const unitTitleEl = document.getElementById("unit-title");
        const questionTextEl = document.getElementById("question-text");
        const optionsListEl = document.getElementById("options-list");
        const nextBtnEl = document.getElementById("next-btn");
        const quizScreenEl = document.getElementById("quiz-screen");
        const resultScreenEl = document.getElementById("result-screen");
        const scoreTextEl = document.getElementById("score-text");
        const resultMessageEl = document.getElementById("result-message");

        function loadQuestion() {
            answered = false;
            nextBtnEl.style.display = "none";
            
            const q = questions[currentQuestion];
            questionCountEl.innerText = `Savol: ${currentQuestion + 1} / ${questions.length}`;
            unitTitleEl.innerText = q.unit;
            questionTextEl.innerText = q.q;
            
            optionsListEl.innerHTML = "";
            q.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = option;
                btn.onclick = () => selectOption(index);
                optionsListEl.appendChild(btn);
            });
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const buttons = optionsListEl.getElementsByClassName("option-btn");

            if (selectedIndex === q.answer) {
                buttons[selectedIndex].classList.add("correct");
                score++;
            } else {
                buttons[selectedIndex].classList.add("incorrect");
                buttons[q.answer].classList.add("correct");
            }

            Array.from(buttons).forEach(btn => btn.disabled = true);
            nextBtnEl.style.display = "block";
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreenEl.style.display = "none";
            resultScreenEl.style.display = "block";
            scoreTextEl.innerText = `${score} / ${questions.length}`;

            let message = "";
            if (score >= 90) {
                message = "Ajoyib natija! Siz kitobni mukammal o'zlashtirgansiz! 🏆";
            } else if (score >= 70) {
                message = "Juda yaxshi! Bilimingiz ancha puxta. 👍";
            } else if (score >= 50) {
                message = "Yomon emas, lekin ba'zi mavzularni takrorlab chiqish kerak. 📚";
            } else {
                message = "Hali ko'proq shug'ullanish kerak ekan. Taslim bo'lmang! 💪";
            }
            resultMessageEl.innerText = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            quizScreenEl.style.display = "block";
            resultScreenEl.style.display = "none";
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
